---
# End-to-end: configure the Darling collector service, then provision Grafana
# dashboards and alerting.
#
# Usage:
#   ansible-playbook -i ansible/inventory ansible/playbooks/main.yml

- name: Configure the Darling collector service
  import_playbook: deploy_perfmon_darling.yml

- name: Deploy PerformanceMonitor dashboards to Grafana
  import_playbook: deploy_perfmon_grafana.yml
