---
- name: Validate required credentials are set
  ansible.builtin.assert:
    that:
      - grafana_api_key | default('') | length > 0
    fail_msg: "grafana_api_key must be set to a non-empty value. See README.md."
    quiet: true
  no_log: true
  tags:
    - datasources
    - dashboards
    - alerting

- name: Provision the Darling datasource
  ansible.builtin.import_tasks: datasources_darling.yml
  tags: datasources

- name: Generate Darling dashboard JSON files
  ansible.builtin.import_tasks: generate_dashboards_darling.yml
  tags:
    - dashboards
    - generate

- name: Import Darling dashboards into Grafana
  ansible.builtin.import_tasks: dashboards_darling.yml
  tags: dashboards

- name: Provision Darling alerting resources
  ansible.builtin.import_tasks: alerting_darling.yml
  tags: alerting

- name: Remove all provisioned resources
  ansible.builtin.import_tasks: teardown.yml
  tags:
    - teardown
    - never
