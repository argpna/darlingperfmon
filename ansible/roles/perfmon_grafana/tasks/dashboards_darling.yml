---
# Separate from dashboards.yml so a run only imports its own edition's line.

- name: Ensure Darling folder exists
  community.grafana.grafana_folder:
    grafana_url: "{{ grafana_url }}"
    grafana_api_key: "{{ grafana_api_key }}"
    title: "{{ grafana_darling_folder }}"
    uid: "{{ grafana_darling_folder_uid }}"
    state: present
  delegate_to: localhost
  no_log: true

- name: Import Darling dashboard
  community.grafana.grafana_dashboard:
    grafana_url: "{{ grafana_url }}"
    grafana_api_key: "{{ grafana_api_key }}"
    path: "{{ item }}"
    folder: "{{ grafana_darling_folder }}"
    overwrite: true
    state: present
  loop: >-
    {{ lookup('fileglob', role_path + '/files/grafana/dashboards/darling/*.json', wantlist=true) }}
  loop_control:
    label: "{{ item | basename | replace('.json', '') }}"
  delegate_to: localhost
  no_log: true

- name: Get all Darling dashboards
  ansible.builtin.uri:
    url: "{{ grafana_url }}/api/search?folderUIDs={{ grafana_darling_folder_uid }}&type=dash-db"
    method: GET
    headers:
      Authorization: "Bearer {{ grafana_api_key }}"
    status_code: [200]
  register: _all_darling_dashboards
  when: perfmon_prune_orphaned | bool
  delegate_to: localhost
  no_log: true

- name: Remove orphaned Darling dashboards
  ansible.builtin.uri:
    url: "{{ grafana_url }}/api/dashboards/uid/{{ item }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ grafana_api_key }}"
    status_code: [200, 404]
  vars:
    _expected_uids: >-
      {{ lookup('fileglob', role_path + '/files/grafana/dashboards/darling/*.json', wantlist=true)
         | map('basename') | map('regex_replace', '\.json$', '') | list }}
  loop: >-
    {{ _all_darling_dashboards.json | map(attribute='uid') | list | difference(_expected_uids) }}
  loop_control:
    label: "{{ item }}"
  when: perfmon_prune_orphaned | bool
  changed_when: false
  delegate_to: localhost
  no_log: true
