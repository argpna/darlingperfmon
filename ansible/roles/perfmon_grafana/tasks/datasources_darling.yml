---
# One PostgreSQL datasource for the whole store - no per-instance fan-out; dashboards
# select instances with the $server variable.

- name: Validate Darling store credentials are set
  ansible.builtin.assert:
    that:
      - perfmon_darling_pg_password | default('') | length > 0
    fail_msg: >-
      perfmon_darling_pg_password must be set.
      Provision the store's least-privilege roles with Darling/tools/provision-roles.sql
      and set this to the "viewer" role's password.
    quiet: true
  no_log: true

- name: Upsert Darling datasource
  ansible.builtin.uri:
    url: "{{ grafana_url }}/api/datasources/uid/{{ perfmon_darling_ds_uid }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ grafana_api_key }}"
    body_format: json
    body:
      name: "{{ perfmon_darling_ds_name }}"
      type: grafana-postgresql-datasource
      uid: "{{ perfmon_darling_ds_uid }}"
      url: "{{ perfmon_darling_pg_host }}:{{ perfmon_darling_pg_port }}"
      database: "{{ perfmon_darling_pg_database }}"
      user: "{{ perfmon_darling_pg_user }}"
      access: proxy
      secureJsonData:
        password: "{{ perfmon_darling_pg_password }}"
      jsonData:
        sslmode: "{{ perfmon_darling_pg_sslmode }}"
        postgresVersion: 1700
        timescaledb: true
    status_code: [200, 404]
  register: _darling_ds_put
  delegate_to: localhost
  no_log: true

- name: Create Darling datasource if new
  ansible.builtin.uri:
    url: "{{ grafana_url }}/api/datasources"
    method: POST
    headers:
      Authorization: "Bearer {{ grafana_api_key }}"
    body_format: json
    body:
      name: "{{ perfmon_darling_ds_name }}"
      type: grafana-postgresql-datasource
      uid: "{{ perfmon_darling_ds_uid }}"
      url: "{{ perfmon_darling_pg_host }}:{{ perfmon_darling_pg_port }}"
      database: "{{ perfmon_darling_pg_database }}"
      user: "{{ perfmon_darling_pg_user }}"
      access: proxy
      secureJsonData:
        password: "{{ perfmon_darling_pg_password }}"
      jsonData:
        sslmode: "{{ perfmon_darling_pg_sslmode }}"
        postgresVersion: 1700
        timescaledb: true
  when: _darling_ds_put.status == 404
  delegate_to: localhost
  no_log: true
