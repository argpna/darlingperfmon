---
# Alerting for the dashboard (MSSQL) line: live-DMV and collect.*/report.* alert rules, one
# per instance per its own MSSQL datasource. See alerting_darling.yml for the Postgres-store
# equivalent.

- name: Provision alert contact points, mute timings, and notification route
  ansible.builtin.import_tasks: alerting_contacts.yml

- name: Provision dashboard-line alert rule groups
  ansible.builtin.import_tasks: alerting_rulegroups.yml
  vars:
    _alerting_template_path: "{{ role_path }}/templates/alerting/rules-instance.yaml.j2"
    _alerting_folder_uid: "{{ grafana_folder_uid }}"
