---
grafana_url: "http://localhost:3000"

# Auto-discovered from the sql_servers inventory group. override with an explicit list.
# Used by alerting_rulegroups.yml to render one alert-rule-group set per instance.
perfmon_instances: "{{ groups['sql_servers'] | default([]) | map('extract', hostvars) | list }}"

# Delete PerfMon-managed dashboards/mute timings/alert rules that exist in Grafana but
# aren't produced by this run - dashboards/mute timings no longer generated or configured,
# alert rules for an instance no longer in perfmon_instances. Off by default: a run against
# a partial inventory would otherwise delete another instance's alert rules.
# Only set true for a run whose inventory is the complete, current fleet.
perfmon_prune_orphaned: false

perfmon_alert_cpu_pct: 80
perfmon_alert_blocking_count: 1
perfmon_alert_deadlock_count: 1
perfmon_alert_tempdb_pct: 80
perfmon_alert_disk_free_pct: 10
perfmon_alert_disk_free_gb: 5
perfmon_alert_query_duration_floor_min: 30
perfmon_alert_poison_wait_floor_ms: 500
perfmon_alert_long_running_job_multiplier: 3
perfmon_alert_failed_job_lookback_min: 60
perfmon_alert_collection_stale_min: 30

# Expects perfmon- prefix
perfmon_alert_mute_timings: []

# List of contact point objects. All entries should share the same name so Grafana
# treats them as one receiver with multiple integrations.
perfmon_alert_contact_points: []

# Receiver the team=perfmon route targets. Matches the contact point name below so no
# extra config is needed once perfmon_alert_contact_points is set. The route is only
# provisioned when perfmon_alert_contact_points is non-empty - see alerting_contacts.yml.
perfmon_alert_receiver_name: perfmon-alerts

perfmon_alert_group_wait: 30s
perfmon_alert_group_interval: 5m
perfmon_alert_repeat_interval: 4h
perfmon_alert_group_by: "team,instance,alertname"

# Darling store connection.
grafana_darling_folder: "PerformanceMonitor (Darling)"
grafana_darling_folder_uid: perfmon-darling

perfmon_darling_ds_name: Darling
perfmon_darling_ds_uid: darling
perfmon_darling_pg_host: darling-pg
perfmon_darling_pg_port: 5432
perfmon_darling_pg_database: darling
perfmon_darling_pg_user: viewer
# perfmon_darling_pg_password: set in inventory group_vars or vault
perfmon_darling_pg_sslmode: disable
