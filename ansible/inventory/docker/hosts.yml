---
# docker-internal inventory for the ansible-runner container
all:
  children:
    sql_servers:
      hosts:
        sql2022:
          ansible_host: mssql-2022
          ansible_connection: local
        sql2025:
          ansible_host: mssql-2025
          ansible_connection: local

    grafana:
      hosts:
        grafana:
          ansible_host: localhost
          ansible_connection: local
          grafana_url: http://grafana:3000

    # Standalone target for verifying the perfmon_darling role - see group_vars/darling.yml.
    # Revisit this later.
    darling:
      hosts:
        darling-role-check:
          ansible_connection: local
