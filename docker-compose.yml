name: darlingperfmon

include:
  - docker/compose.darling.yml

x-mssql-env: &mssql-env
  ACCEPT_EULA: "Y"
  MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
  MSSQL_PID: Developer
  MSSQL_AGENT_ENABLED: "true"
  TZ: America/New_York
  MSSQL_MEMORY_LIMIT_MB: "1536"

x-mssql-deploy: &mssql-deploy
  cpuset: "0,1"
  deploy:
    resources:
      limits:
        memory: 2g

x-workload-deploy: &workload-deploy
  deploy:
    resources:
      limits:
        memory: 256m

x-healthcheck-modern: &healthcheck-modern
  test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' -o /dev/null"]
  interval: 10s
  timeout: 10s
  retries: 30
  start_period: 30s

services:
  mssql-2022:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: perfmon-mssql-2022
    <<: *mssql-deploy
    environment:
      <<: *mssql-env
    healthcheck:
      <<: *healthcheck-modern
    ports:
      - "14333:1433"
    volumes:
      - mssql-2022-data:/var/opt/mssql

  mssql-2025:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: perfmon-mssql-2025
    <<: *mssql-deploy
    environment:
      <<: *mssql-env
    healthcheck:
      <<: *healthcheck-modern
    ports:
      - "14334:1433"
    volumes:
      - mssql-2025-data:/var/opt/mssql

  ansible-runner:
    build:
      context: .
      dockerfile: docker/ansible-runner/Dockerfile
    container_name: perfmon-ansible-runner
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      mssql-2022:
        condition: service_healthy
      mssql-2025:
        condition: service_healthy
      grafana:
        condition: service_healthy
      darling-pg:
        condition: service_healthy
        required: false
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_USER: admin
      DARLING_PG_PASSWORD: ${DARLING_PG_PASSWORD}
      DARLING_VIEWER_PASSWORD: ${DARLING_VIEWER_PASSWORD}
    volumes:
      - ./.env:/workspace/.env
      - ./ansible:/workspace/ansible
      - ./bootstrap:/workspace/bootstrap:ro
      - ./scripts:/workspace/scripts:ro
      - darling-config:/etc/darling
    restart: "no"

  # demo workload against mssql-2022
  workload:
    build:
      context: .
      dockerfile: docker/workload/Dockerfile
    container_name: perfmon-workload
    <<: *workload-deploy
    depends_on:
      mssql-2022:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      TARGET_HOST: mssql-2022
    entrypoint: ["/bin/bash", "/scripts/workload.sh"]
    volumes:
      - ./scripts/workload.sh:/scripts/workload.sh:ro
    restart: unless-stopped

  # memory-pressure workload against mssql-2025
  workload-memory:
    build:
      context: .
      dockerfile: docker/workload/Dockerfile
    container_name: perfmon-workload-memory
    <<: *workload-deploy
    depends_on:
      mssql-2025:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      TARGET_HOST: mssql-2025
    entrypoint: ["/bin/bash", "/scripts/workload-memory.sh"]
    volumes:
      - ./scripts/workload-memory.sh:/scripts/workload-memory.sh:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.5
    container_name: perfmon-grafana
    deploy:
      resources:
        limits:
          memory: 512m
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "false"
      # dynamic dashboards: required for the v2 fleet dashboard's
      # conditional rendering.
      GF_FEATURE_TOGGLES_ENABLE: dashboardNewLayouts
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mssql-2022-data:
  mssql-2025-data:
  grafana-data:
