name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install tooling
        run: pip install -r requirements.txt
      - name: black
        run: black --check .
      - name: pylint
        run: git ls-files '*.py' | xargs pylint
      - name: ansible-lint
        run: ansible-lint

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: static
    steps:
      - uses: actions/checkout@v4
      - name: Start stack with darling profile
        run: |
          cp .env.example .env
          docker compose --profile darling up -d --wait \
            --scale ansible-runner=0 \
            --scale darling-provision=0 \
            --scale darling-collector-config=0 \
            --scale darling-plan-gunzip=0
      - name: Run one-shot store setup jobs
        run: |
          docker compose --profile darling up -d \
            darling-provision darling-collector-config darling-plan-gunzip
      - name: Verify the perfmon_darling collector role
        run: |
          docker compose run --rm ansible-runner \
            ansible-playbook -i /workspace/ansible/inventory/docker \
            /workspace/ansible/playbooks/deploy_perfmon_darling.yml
      - name: Wait for the Darling store to migrate and provision roles
        run: |
          rc=$(docker wait perfmon-darling-provision)
          docker logs perfmon-darling-provision 2>&1 | tail -40
          exit "$rc"
      - name: Wait for collector schedule provisioning
        run: |
          rc=$(docker wait perfmon-darling-collector-config)
          docker logs perfmon-darling-collector-config 2>&1 | tail -40
          exit "$rc"
      - name: Wait for plan-gunzip provisioning
        run: |
          rc=$(docker wait perfmon-darling-plan-gunzip)
          docker logs perfmon-darling-plan-gunzip 2>&1 | tail -40
          exit "$rc"
      - name: Deploy Grafana dashboards
        run: |
          docker compose run --rm ansible-runner \
            ansible-playbook -i /workspace/ansible/inventory/docker \
            /workspace/ansible/playbooks/deploy_perfmon_grafana.yml
      - name: Assert datasource, auth, alert rules
        run: python3 scripts/e2e-checks.py
      - name: Smoke-test every panel query
        run: |
          GRAFANA_API_KEY=$(grep '^GRAFANA_API_KEY=' .env | cut -d= -f2-)
          export GRAFANA_API_KEY
          python3 scripts/verify-panels.py darling
      # docker/darling/entrypoint.sh: adding a SQL-auth instance must not
      # require a manual `docker restart` of the darling container.
      - name: Capture the collector's server count before adding a new instance
        run: |
          docker logs perfmon-darling > /tmp/darling-log-before.txt 2>&1
          baseline_count=$(grep -oP 'Loaded configuration from \S+: \K[0-9]+(?= server)' /tmp/darling-log-before.txt | tail -1)
          echo "baseline_count=$baseline_count" >> "$GITHUB_ENV"
      - name: Add a new SQL-auth instance and re-run the collector role
        run: |
          cat > ansible/inventory/docker/ci-extra-instance.yml <<'EOF'
          ---
          all:
            children:
              sql_servers:
                hosts:
                  sql-e2e-extra:
                    ds_host: nonexistent-sql-host
                    darling_name: SQL2022-EXTRA
          EOF
          docker compose run --rm ansible-runner \
            ansible-playbook -i /workspace/ansible/inventory/docker \
            -i /workspace/ansible/inventory/docker/ci-extra-instance.yml \
            /workspace/ansible/playbooks/deploy_perfmon_darling.yml
          rm -f ansible/inventory/docker/ci-extra-instance.yml
      - name: Assert the collector auto-restarted and picked up the new instance
        run: |
          for i in $(seq 1 18); do
            docker logs perfmon-darling > /tmp/darling-log-after.txt 2>&1
            grep -q "darling.json changed, restarting the collector" /tmp/darling-log-after.txt && break
            sleep 5
          done
          grep -q "darling.json changed, restarting the collector" /tmp/darling-log-after.txt || {
            echo "entrypoint never observed the darling.json change"
            tail -60 /tmp/darling-log-after.txt
            exit 1
          }
          new_count=$(grep -oP 'Loaded configuration from \S+: \K[0-9]+(?= server)' /tmp/darling-log-after.txt | tail -1)
          if [ "$new_count" != "$((baseline_count + 1))" ]; then
            echo "expected a fresh process to load $((baseline_count + 1)) server(s), got ${new_count:-<none>}"
            tail -60 /tmp/darling-log-after.txt
            exit 1
          fi
      # scripts are idempotent: a second full deploy must succeed
      - name: Deploy re-run succeeds
        run: |
          docker compose run --rm ansible-runner \
            ansible-playbook -i /workspace/ansible/inventory/docker \
            /workspace/ansible/playbooks/deploy_perfmon_grafana.yml
      - name: Diagnostics
        if: failure()
        run: |
          docker compose --profile darling ps -a
          docker compose --profile darling logs --tail 100 \
            darling darling-provision darling-collector-config darling-plan-gunzip \
            grafana mssql-2022 mssql-2025
